name: Telegram auswerten (Wochenende)
on:
  schedule:
    - cron: "*/30 6-21 * * 0,6"   # Samstag und Sonntag, etwa 7 bis 22 Uhr deutscher Zeit
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: depot
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/tg_only.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Aenderungen speichern
        run: |
          git config user.name "depot-bot"
          git config user.email "depot-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Telegram $(date -u +%F\ %H:%M)"
          git push
